[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "alarm-clock-cli"
version = "1.0.0"
description = "Production-quality testable Python CLI alarm clock"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
alarm-clock = "alarm_clock.__main__:main"

[tool.setuptools]
packages = ["alarm_clock"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
